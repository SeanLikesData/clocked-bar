name: Clocked
options:
  bundleIdPrefix: com.seanlikesdata
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"

targets:
  Clocked:
    type: application
    platform: macOS
    sources:
      - path: Clocked
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seanlikesdata.clocked
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        LSApplicationCategoryType: public.app-category.productivity
    info:
      path: Clocked/Info.plist
      properties:
        CFBundleName: Clocked
        CFBundleDisplayName: Clocked
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        NSHumanReadableDescription: Menubar project time tracker
        NSPrincipalClass: NSApplication
